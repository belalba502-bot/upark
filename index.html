*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif}

p{margin:0 0 .75rem;color:var(--mut);max-width:62ch}

.logo{font-weight:700;font-size:1.25rem;display:flex;gap:.4rem;align-items:center;cursor:pointer;background:none;border:0;color:var(--ink)}
.logo i{background:var(--blue);color:#fff;border-radius:6px;padding:0 .45rem;font-style:normal}
nav{display:flex;flex-wrap:wrap;gap:.25rem;flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:.45rem .8rem}
button:hover{border-color:var(--blue)}button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.pri:hover{filter:brightness(1.1)}
.act{border-color:var(--blue);color:var(--blue);font-weight:600}
button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
main{max-width:1100px;margin:0 auto;padding:1rem}
section{padding:2rem 0;border-top:1px solid var(--line)}
.hero{display:grid;gap:2rem;grid-template-columns:1fr 1fr;align-items:center;border:0}
@media(max-width:800px){.hero,.two{grid-template-columns:1fr!important}}
.two{display:grid;gap:1rem;grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}
.mapbox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--road)}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.num{font-size:1.8rem;font-weight:700}.mut{color:var(--mut);font-size:.9rem}
.note{background:var(--card);border-inline-start:4px solid var(--warn);padding:.5rem .75rem;border-radius:6px;font-size:.9rem;color:var(--mut);margin:.75rem 0}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-inline-end:.3rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:start;padding:.4rem;border-bottom:1px solid var(--line)}
.tbl{overflow-x:auto}
input,textarea{font:inherit;width:100%;padding:.5rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;margin:.6rem 0 .2rem;font-weight:600;font-size:.9rem}.err{color:var(--bad);font-size:.85rem}
ol{padding-inline-start:1.2rem;margin:.5rem 0}li{margin:.25rem 0}

.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:30;padding:1rem}.modal .card{max-width:420px}
.bar{height:10px;background:var(--road);border-radius:5px;overflow:hidden}.bar b{display:block;height:100%;background:var(--blue)}
.qr svg{width:180px;height:180px;background:#fff;padding:6px;border-radius:8px}
@media print{header,#toast,.noprint{display:none!important}}

if(f==0)s+=mk(ENT.x,ENT.y,'E','#0f1b33');if(o.ref&&f==REF.f)s+=mk(REF.x,REF.y,'●','#1456f0');s+=mk(RAMP.x,RAMP.y,'R','#55627d');return s+'</svg>'}
const tabs=f=>`<div class="row" role="tablist">${[0,1].map(i=>`<button role="tab" aria-selected="${f==i}" class="${f==i?'on':''}" data-a="floor" data-id="${i}">${t('fl'+i)} · ${t('zone')} ${i?'B':'A'}</button>`).join('')}</div>`;
const legend=()=>`<div class="row mut">${['available','occupied','unavailable'].map(k=>`<span><i class="sw" style="background:${ST[k]}"></i>${t(SK[k])}</span>`).join('')}<span><i class="sw" style="border:3px solid #1456f0"></i>${t('sel')}</span><span>E ${t('ent')}</span><span>R ${t('rp')}</span></div>`;
const zoom=()=>`<div class="row noprint"><button data-a="zoom" data-id="-30" aria-label="−">−</button><button data-a="zoom" data-id="30" aria-label="+">+</button></div>`;
const mbox=(f,o)=>`<div class="mapbox" dir="ltr">${map(f,o)}</div>`;
/* ---- views ---- */
function head(){return`<header><button class="logo" data-a="go" data-id=""><i>U</i>Park</button><nav>${[['','n_home'],['park','n_park'],['find','n_find'],['admin','n_admin']].map(([h,k])=>`<button data-a="go" data-id="${h}">${t(k)}</button>`).join('')}</nav><button data-a="tour">${t('tour')}</button><button data-a="resetq">${t('reset')}</button><button data-a="lang" data-id="${S.lang=='en'?'ar':'en'}" aria-label="Language">${S.lang=='en'?'العربية':'English'}</button></header>`}
function home(){const r=recommend(),rt=r&&pathTo(ENT,r.id),c=S.cfg;const f=R.f||{};const er=R.err||{};
const fld=(k,l,ty='text')=>`<label for="f_${k}">${t(l)}</label><input id="f_${k}" name="${k}" type="${ty}" value="${e(f[k]||'')}" aria-invalid="${!!er[k]}">${er[k]?`<span class="err">${t(er[k])}</span>`:''}`;
return`<section class="hero"><div><h1>${t('h1')}</h1><p>${t('p1',{mall:e(c.mall)})}</p><div class="row"><button class="pri" data-a="go" data-id="park">${t('cta1')}</button><button data-a="go" data-id="admin">${t('cta2')}</button></div><div class="note">${t('sim')}</div></div><div>${mbox(0,{routes:rt,rec:r&&r.id,z:100})}${legend()}</div></section>
<section><h2>${t('how')}</h2><div class="grid">${['a','b','c'].map(k=>`<div class="card"><h3>${t('h_'+k)}</h3><p>${t('h_'+k+'d')}</p></div>`).join('')}</div></section>
<section class="two"><div><h2>${t('mg')}</h2><p>${t('mgp')}</p></div><div><h2>${t('ai')}</h2><p>${t('aip')}</p></div></section>
<section id="pricing"><h2>${t('pr')}</h2><p>${t('prp')}</p><div class="card"><div class="grid"><div><label for="p_setup">${t('setup')}</label><input id="p_setup" data-k="setup" type="number" min="0" value="${c.setup}"></div><div><label for="p_annual">${t('annual')}</label><input id="p_annual" data-k="annual" type="number" min="0" value="${c.annual}"></div><div><label for="p_cur">${t('cur')}</label><input id="p_cur" data-k="cur" maxlength="4" value="${e(c.cur)}"></div></div><div class="grid" style="margin-top:1rem"><div><div class="mut">${t('y1')}</div><div class="num" id="y1">${nf(c.setup+c.annual)} ${e(c.cur)}</div></div><div><div class="mut">${t('y3')}</div><div class="num" id="y3">${nf(c.setup+3*c.annual)} ${e(c.cur)}</div></div></div><div class="note">${t('prp')}</div></div></section>
<section><h2>${t('pv')}</h2><ul style="color:var(--mut)"><li>${t('pv1')}</li><li>${t('pv2')}</li><li>${t('pv3')}</li></ul></section>
<section class="two"><div><h2>${t('rq')}</h2>${R.ok?`<div class="note" role="status">${t('sent')}</div>`:''}<form id="rf" novalidate class="card">${fld('name','nm')}${fld('email','em','email')}${fld('org','org')}${fld('role','role')}<label for="f_msg">${t('msg')}</label><textarea id="f_msg" name="msg" rows="3">${e(f.msg||'')}</textarea><div class="row"><button class="pri" type="submit">${t('send')}</button></div><p class="mut">${t('sim')}</p></form></div></section>`}
function park(){const r=V.rec?get(V.rec):null,sel=V.sel&&get(V.sel);const rt=sel&&pathTo(ENT,sel.id);const free=S.sp.some(s=>s.st=='available'&&!s.sid);
return`<section style="border:0"><h1 style="font-size:1.8rem">${t('n_park')}</h1><div class="note">${t('sim')}</div>${tabs(V.f)}${legend()}${zoom()}${mbox(V.f,{act:'sp',sel:V.sel,rec:V.rec,routes:rt,z:V.z})}<div class="row"><button class="act" data-a="rec">${t('rec')}</button>${!free?`<span class="err">${t('none')}</span>`:`<span class="mut">${t('hint')}</span>`}</div>
${sel?`<div class="card"><h3>${t('dirs')} · ${sel.id} · ${fl(sel.f)}</h3><ol>${steps(rt,sel.id).map(x=>`<li>${e(x)}</li>`).join('')}</ol><button class="pri" data-a="confirm">${t('conf',{id:sel.id})}</button></div>`:''}</section>`}
function qr(url){try{const q=qrcode(0,'M');q.addData(url);q.make();return`<div class="qr" role="img" aria-label="QR">${q.createSvgTag({cellSize:4,margin:1,scalable:true})}</div>`}catch(x){return`<div class="note">${t('qf')}</div>`}}
function sess(id){const s=S.sessions[id];if(!/^[A-Z0-9]{8}$/.test(id)||!s)return msg('ih','ip');if(!live(s))return msg('xh','xp');S.active=id;const sp=get(s.sp),url=base()+'#s-'+id;
return`<section style="border:0"><h1 style="font-size:1.8rem">${t('sh')}</h1><div class="two"><div class="card"><div class="mut">${e(S.cfg.mall)}</div><div class="num">${sp.id}</div><p>${fl(sp.f)} · ${t('zone')} ${zn(sp)}</p><p>${t('ref')}: <b>${id}</b></p>${mbox(sp.f,{sel:sp.id,z:100})}</div><div class="card"><div class="row" style="justify-content:center">${qr(url)}</div><p class="mut">${t('qn')}</p><label for="lnk">${t('lk')}</label><input id="lnk" readonly value="${e(url)}"><div class="row noprint"><button data-a="copy" data-id="${e(url)}">${t('cp')}</button><button data-a="print">${t('pt')}</button><button class="pri" data-a="go" data-id="find">${t('fh')}</button><button data-a="end" data-id="${id}">${t('end')}</button></div></div></div></section>`}
const msg=(h,p)=>`<section style="border:0"><div class="card"><h2>${t(h)}</h2><p>${t(p)}</p><button class="pri" data-a="go" data-id="park">${t('cta1')}</button></div></section>`;
function find(){const s=S.active&&S.sessions[S.active];if(!s||!live(s))return msg('nh','np');const sp=get(s.sp),rt=pathTo(REF,sp.id),f=V.f==null||R.fv!==s.sp?sp.f:V.f;R.fv=s.sp;
return`<section style="border:0"><h1 style="font-size:1.8rem">${t('fh')}</h1><p>${t('from',{ref:t('refn')})}</p>${tabs(f)}${mbox(f,{sel:sp.id,routes:rt,ref:1,z:V.z})}<div class="card"><h3>${sp.id} · ${fl(sp.f)} · ${t('zone')} ${zn(sp)}</h3><ol>${steps(rt,sp.id).map(x=>`<li>${e(x)}</li>`).join('')}</ol><div class="row"><button data-a="copy" data-id="${S.active}">${t('cp')}: ${S.active}</button><button class="pri" data-a="go" data-id="s-${S.active}">${t('back')}</button></div></div></section>`}
function csv(){const m=M_(),L=[['U-Park report',S.cfg.mall],['Generated',new Date().toISOString()],['Disclaimer','Illustrative demo data'],['Floor','Total','Occupied','Available','Unavailable','Occupancy %']];[0,1].forEach(f=>{const a=S.sp.filter(s=>s.f==f),o=a.filter(s=>s.st=='occupied').length,u=a.filter(s=>s.st=='unavailable').length;L.push([fl(f),a.length,o,a.length-o-u,u,Math.round(o/a.length*100)])});L.push(['All',m.n,m.o,m.a,m.u,m.pct]);['arrival','departure','conflict','manual'].forEach(k=>L.push(['events:'+k,S.events.filter(x=>x.type==k).length]));return L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')}
function admin(){const m=M_(),sel=V.sel&&get(V.sel),card=(k,v)=>`<div class="card"><div class="mut">${t(k)}</div><div class="num">${v}</div></div>`;
const open=S.events.filter(x=>x.type=='conflict'&&x.st=='open').length;
return`<section style="border:0"><h1 style="font-size:1.8rem">${t('n_admin')} · ${e(S.cfg.mall)}</h1><div class="note">${t('sim')}</div><label for="mn">${t('mall')}</label><input id="mn" data-k="mall" value="${e(S.cfg.mall)}" style="max-width:320px">
<div class="grid" style="margin:1rem 0">${card('m_t',nf(m.n))}${card('m_o',nf(m.o))}${card('m_a',nf(m.a))}${card('m_p',m.pct+'%')}${card('m_u',nf(m.u))}${card('m_s',nf(m.act))}</div>
<div class="row"><button class="act" data-a="ev" data-id="arrival">${t('arrive')}</button><button class="act" data-a="ev" data-id="departure">${t('depart')}</button><button class="act" data-a="ev" data-id="conflict">${t('conflict')}</button></div>
<div class="two"><div>${tabs(V.f)}${legend()}${zoom()}${mbox(V.f,{act:'csp',sel:V.sel,z:V.z})}</div><div><div class="card"><h3>${t('insp')}</h3>${sel?`<p><b>${sel.id}</b> · ${fl(sel.f)} · ${t(SK[sel.st])}<br>${t('veh')}: ${e(sel.veh||'—')}${sel.sid?`<br>${t('held',{sid:sel.sid})}`:''}</p><div class="row"><button data-a="mark" data-id="occupied">${t('mo')}</button><button data-a="mark" data-id="available">${t('ma')}</button><button data-a="mark" data-id="unavailable">${t('mu')}</button></div>`:`<p>${t('hint')}</p>`}</div>
<div class="card" style="margin-top:.75rem"><h3>${t('cams')}</h3>${S.cams.map(c=>`<div class="row"><b>${c.id}</b> ${fl(c.f)} · <span style="color:${c.on?'var(--ok)':'var(--bad)'}">${t(c.on?'on':'off')}</span><button data-a="cam" data-id="${c.id}">${t('tg')}</button></div>`).join('')}</div></div></div>
<h2 style="margin-top:1.5rem">${t('ev')}</h2><div class="tbl card">${S.events.length?`<table><thead><tr><th>${t('time')}</th><th>${t('type')}</th><th>${t('sp')}</th><th>${t('veh')}</th><th>${t('cam')}</th><th>${t('status')}</th></tr></thead><tbody>${S.events.slice(0,12).map(x=>`<tr><td>${tm(x.ts)}</td><td>${t('t_'+x.type)}</td><td>${e(x.sp)}</td><td>${e(x.veh||'—')}</td><td>${e(x.cam||'—')}</td><td>${t('st_'+x.st)}${x.st=='open'?` <button data-a="resolve" data-id="${x.id}">${t('ra')}</button> <button data-a="dismiss" data-id="${x.id}">${t('dis')}</button>`:''}</td></tr>`).join('')}</tbody></table>`:`<p>${t('noev')}</p>`}</div>
<h2 style="margin-top:1.5rem">${t('rep')}</h2><div class="card"><p>${e(S.cfg.mall)} · ${t('period')} · ${t('gen')}: ${new Date().toLocaleString(S.lang=='ar'?'ar-EG':'en-GB')}</p>${[0,1].map(f=>{const a=S.sp.filter(s=>s.f==f),o=a.filter(s=>s.st=='occupied').length,p=Math.round(o/a.length*100);return`<div class="row"><span style="min-width:120px">${fl(f)}</span><div class="bar" style="flex:1" role="img" aria-label="${p}%"><b style="width:${p}%"></b></div><b>${p}%</b></div>`}).join('')}<p class="mut">${t('disc')}</p><textarea readonly rows="6" aria-label="CSV" dir="ltr">${e(csv())}</textarea><div class="row"><button data-a="copy" data-id="__csv">${t('ccsv')}</button></div></div></section>`}
/* ---- render / actions ---- */
function render(){const h=location.hash.slice(1),sid=h.startsWith('s-')?h.slice(2):null;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';
let v=sid!=null?sess(sid):h=='park'?park():h=='find'?find():h=='admin'?admin():home();
const md=M?(M.k=='reset'?`<div class="modal" role="dialog" aria-modal="true"><div class="card"><p>${t('rq_')}</p><div class="row"><button class="pri" data-a="resetok">${t('ok')}</button><button data-a="close">${t('cancel')}</button></div></div></div>`:`<div class="modal" role="dialog" aria-modal="true"><div class="card"><p>${M.i+1}/4 · ${t('tour'+(M.i+1))}</p><div class="row"><button class="pri" data-a="tnext">${M.i<3?t('next'):t('skip')}</button>${M.i<3?`<button data-a="close">${t('skip')}</button>`:''}</div></div></div>`):'';
$('#app').innerHTML=head()+'<main>'+v+'</main>'+md;save()}
const $=s=>document.querySelector(s);
function toast(m){const x=$('#toast');x.textContent=m;x.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>x.hidden=true,3500)}
function pickNew(){const b=recommend();return b}
const A={lang:id=>{S.lang=id},go:id=>{if(location.hash.slice(1)==id)return;V={f:0,sel:null,z:100,rec:null};location.hash=id;return 1},
floor:id=>{V.f=+id},zoom:id=>{V.z=Math.min(220,Math.max(100,V.z+ +id))},
sp:id=>{const s=get(id);if(s.st!='available'||s.sid){const a=recommend();toast(a?t('taken',{id,alt:a.id}):t('none'));return}V.sel=id},
rec:()=>{const r=recommend();if(!r)return toast(t('none'));V.rec=V.sel=r.id;V.f=r.f},
confirm:()=>{const s=get(V.sel);if(!s||s.st!='available'||s.sid){const a=recommend();toast(a?t('taken',{id:V.sel,alt:a.id}):t('none'));if(a){V.rec=V.sel=a.id;V.f=a.f}return}
const id=mkId();S.sessions[id]={id,sp:s.id,created:Date.now(),ended:false};s.st='occupied';s.sid=id;s.veh='DEMO-'+(2000+Math.floor(Math.random()*7000));S.active=id;log('arrival',s.id,s.veh,(camFor(s.f)||{}).id,'ok',id);location.hash='s-'+id;return 1},
csp:id=>{V.sel=id},
mark:id=>{const s=get(V.sel);if(!s)return;if(s.sid&&id=='available')return toast(t('held',{sid:s.sid}));if(s.sid&&id=='occupied')return;s.st=id;if(id=='available')s.veh=null;log('manual',s.id,s.veh,null,s.sid&&id=='unavailable'?'open':'ok',s.sid);if(s.sid&&id=='unavailable')S.events[0].type='conflict'},
ev:id=>{if(id=='arrival'){const c=S.sp.filter(s=>s.st=='available'&&!s.sid&&camFor(s.f));if(!c.length)return toast(t('nocam'));const s=c[Math.floor(Math.random()*c.length)];s.st='occupied';s.veh='DEMO-'+(3000+Math.floor(Math.random()*6000));log('arrival',s.id,s.veh,camFor(s.f).id)}
else if(id=='departure'){const c=S.sp.filter(s=>s.st=='occupied'&&!s.sid&&camFor(s.f));if(!c.length)return toast(t('nocam'));const s=c[Math.floor(Math.random()*c.length)];log('departure',s.id,s.veh,camFor(s.f).id);s.st='available';s.veh=null}
else{const x=Object.values(S.sessions).find(live);if(!x)return toast(t('none_s'));const s=get(x.sp);log('conflict',s.id,'DEMO-'+(7000+Math.floor(Math.random()*2000)),(camFor(s.f)||{id:'CAM-?'}).id,'open',x.id)}},
cam:id=>{const c=S.cams.find(c=>c.id==id);c.on=!c.on},
resolve:id=>{const ev=S.events.find(x=>x.id==id),ss=S.sessions[ev.sid],old=get(ss.sp),n=recommend();if(!n)return toast(t('none'));old.sid=null;if(ev.veh){old.veh=ev.veh;old.st='occupied'}n.st='occupied';n.sid=ss.id;n.veh='DEMO-'+(2000+Math.floor(Math.random()*7000));ss.sp=n.id;ev.st='resolved';toast(t('moved',{id:n.id}))},
dismiss:id=>{S.events.find(x=>x.id==id).st='dismissed'},
end:id=>{const s=S.sessions[id];s.ended=true;const p=get(s.sp);p.sid=null;p.st='available';p.veh=null;log('departure',p.id,null,null,'ok',id);S.active=null;location.hash='park';return 1},
copy:id=>{const v=id=='__csv'?csv():id;try{navigator.clipboard.writeText(v).then(()=>toast(t('cpd')),()=>toast(v))}catch(x){toast(v)}return 1},
print:()=>{try{window.print()}catch(x){}return 1},
resetq:()=>{M={k:'reset'}},resetok:()=>{S=seed(S.lang);M=null;V={f:0,sel:null,z:100,rec:null};if(location.hash)location.hash='';},close:()=>{M=null},
tour:()=>{M={k:'tour',i:0}},tnext:()=>{M.i++;if(M.i>3)M=null}};
document.addEventListener('click',ev=>{const n=ev.target.closest('[data-a]');if(!n||!n.dataset.a)return;const r=A[n.dataset.a](n.dataset.id);if(r!==1)render()});
document.addEventListener('keydown',ev=>{if(ev.key=='Enter'||ev.key==' '){const n=ev.target.closest('g[data-a]');if(n){ev.preventDefault();n.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}if(ev.key=='Escape'&&M){M=null;render()}});
document.addEventListener('input',ev=>{const k=ev.target.dataset.k;if(!k||k=='mall')return;const c=S.cfg;c[k]=k=='cur'?ev.target.value.slice(0,4):Math.max(0,+ev.target.value||0);$('#y1').textContent=nf(c.setup+c.annual)+' '+c.cur;$('#y3').textContent=nf(c.setup+3*c.annual)+' '+c.cur;save()});
document.addEventListener('change',ev=>{if(ev.target.dataset.k=='mall'){S.cfg.mall=ev.target.value.trim().slice(0,60)||'Nile Gate Mall';render()}});
document.addEventListener('submit',ev=>{if(ev.target.id!='rf')return;ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target)),er={};['name','email','org','role'].forEach(k=>{if(!String(d[k]||'').trim())er[k]='req'});if(!er.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email))er.email='bad';R=Object.keys(er).length?{f:d,err:er}:{ok:1};render()});
window.addEventListener('hashchange',()=>{V={f:0,sel:null,z:100,rec:null};R={};render()});
render();
</script></body></html>
